- type: job
  id: PlantManager
  name: job-name-plant-manager
  description: job-description-plant-manager
  playTimeTracker: JobPlantManager
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 72000 # Frontier - 20 hrs (the real condition here is the whitelist)
  whitelisted: true # Wayfarer: false<true # WHITELIST REQUIREMENTS: BUILD A FUNCTIONAL TESLA, TEG OR NUCLEAR REACTOR
  startingGear: PlantManagerGear
  alwaysUseSpawner: true
  icon: "JobIconChiefEngineer" # Wayfarer: PlantManager<ChiefEngineer
  requireAdminNotify: true
  supervisors: job-supervisors-centcom
  weight: 160
  displayWeight: 10
  canBeAntag: false
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, NFSDTrackingImplant ]
  - !type:AddComponentSpecial
    components:
      - type: PreventShipyardTitleOverwrite
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  # Wayfarer: Spooky month!
  - !type:GiveItemOnHolidaySpecial
    holiday: Halloween
    prototype: TreatBagRandomTreat
  # End Wayfarer

- type: startingGear
  id: PlantManagerGear
  equipment:
    pocket1: NFWeaponEnergyPistolDisabler # for the riff-raff
    pocket2: HolofanProjector
  storage:
    back:
    - RubberStampPlantManager
    - HandheldSecurityMonitor
    - DoorRemoteEngineering

- type: chameleonOutfit
  id: PlantManagerChameleonOutfit
  job: PlantManager
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretEngineering
    mask: ClothingMaskBreath
    neck: ClothingNeckCloakCe
    outerClothing: ClothingOuterWinterCE
    gloves: ClothingHandsGlovesColorYellow
    shoes: ClothingShoesBootsMagAdv
