# Base Goodie Bag

- type: entity
  name: goodie bag
  parent: [ BoxBase, RecyclableItemPaper ]
  id: WFGoodieBag
  description: A goodie bag made for festive occasions!
  components:
  - type: Sprite
    sprite: _WF/Objects/Decoration/goodiebag.rsi
    layers:
    - state: costumebag
  - type: Item
    size: Large
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,3,3

- type: entity
  name: goodie bundle
  parent: [ WFGoodieBag, RecyclableItemPaper ]
  id: WFGoodieBundle
  description: A goodie bag containing a festive costume.
  abstract: true

