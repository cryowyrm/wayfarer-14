# Base Candy Bucket

- type: entity
  parent: [ CandyBucket ]
  id: WFCandyBundle
  abstract: true
  components:
#  - type: Tag
#    tags: [] # ignore "WhitelistChameleon" tag
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,2
    whitelist:
      components:
      - Pill
      - VentriloquistPuppet
      tags:
      - FoodSnack
      - Pill

