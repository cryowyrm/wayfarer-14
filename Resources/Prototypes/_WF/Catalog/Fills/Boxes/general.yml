- type: entity
  name: magic candle box
  parent: BoxCardboard
  id: BoxCandleInfinite
  description: This box is specifically moulded to only carry magic candles.
  components:
  - type: Sprite
    layers:
    - state: box
    - state: candle
  - type: Storage
    grid:
    - 0,0,5,3
    whitelist:
      tags:
      - CandleInfinite
  - type: StorageFill
    contents:
    - id: CandleInfinite
      amount: 2
    - id: CandleBlueInfinite
      amount: 2
    - id: CandleRedInfinite
      amount: 2
    - id: CandleGreenInfinite
      amount: 2
    - id: CandlePurpleInfinite
      amount: 2
    - id: CandleBlackInfinite
      amount: 2

