# Halloween Gift Bags
- type: entity
  id: TreatBagBase
  name: trick or treat bag
  description: A little goodie bag known for its wondrous surprises. Feeling lucky?
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/Objects/Decoration/goodiebag.rsi
    layers:
    - state: goodiebag

- type: entity
  id: TreatBag
  parent: [TreatBagBase, BaseStorageItem]
  suffix: Empty
  components:
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2


- type: entity
  id: GoodieBagTrash
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  name: wrapping paper
  description: Carefully wrapped and tied with a ribbon. Then ceremoniously ripped apart and tossed on the floor.
  components:
  - type: Sprite
    sprite: _WF/Objects/Decoration/goodiebag.rsi
    layers:
    - state: unwrapped
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

# Halloween Gift Bags: Gambling Edition

- type: entity
  id: TreatBagRandom
  parent: [TreatBagBase, BaseItem]
  suffix: Random
  components:
  - type: SpawnItemsOnUse
    items:
      - id: GoodieBagTrash
      # They can have one as a treat still
